<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>학교회계 질의회신</title>
<meta name="description" content="대학 회계·계약·사업비 집행 관련 질의와 검토 의견 모음">
<style>
:root {
  --bg: #f6f6f3; --surface: #ffffff; --ink: #1d1f22; --muted: #63676d; --line: #e3e2dc;
  --accent: #2f5d50; --accent-soft: #e6efeb; --warn: #8a5a00; --warn-soft: #fbf1dc; --done: #2f5d50;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15171a; --surface: #1d2024; --ink: #e8e8e5; --muted: #9a9ea4; --line: #2e3237;
    --accent: #8cc4b2; --accent-soft: #23332e; --warn: #e6b866; --warn-soft: #3a2f1a; --done: #8cc4b2;
  }
}
:root[data-theme="dark"] {
  --bg: #15171a; --surface: #1d2024; --ink: #e8e8e5; --muted: #9a9ea4; --line: #2e3237;
  --accent: #8cc4b2; --accent-soft: #23332e; --warn: #e6b866; --warn-soft: #3a2f1a; --done: #8cc4b2;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 15px/1.65 "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  word-break: keep-all; overflow-wrap: anywhere;
}
header { border-bottom: 1px solid var(--line); background: var(--surface); }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 16px; }
.top { display: flex; align-items: baseline; gap: 12px; padding: 18px 0 14px; flex-wrap: wrap; }
.top h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
.top a { color: inherit; text-decoration: none; }
.top .count { color: var(--muted); font-size: 13px; }
.tools { display: flex; gap: 8px; flex-wrap: wrap; padding-bottom: 14px; align-items: center; }
.tools input {
  flex: 1 1 260px; min-width: 0; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--bg); color: var(--ink); font: inherit;
}
.chip {
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px;
  padding: 5px 12px; font: inherit; font-size: 13px; cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.layout { display: grid; grid-template-columns: 360px 1fr; gap: 24px; padding: 24px 0 48px; align-items: start; }
.list { display: flex; flex-direction: column; gap: 10px; position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow: auto; }
.card {
  display: block; text-align: left; width: 100%; background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 14px 16px; color: inherit; text-decoration: none; font: inherit;
}
.card:hover { border-color: var(--accent); }
.card[aria-current="true"] { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.card .meta { display: flex; gap: 8px; font-size: 12px; color: var(--muted); align-items: center; flex-wrap: wrap; }
.card .t { font-weight: 600; margin-top: 4px; line-height: 1.45; }
.status { font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); }
.status.done { background: var(--accent-soft); color: var(--done); }
.tag { font-size: 12px; color: var(--accent); }
.detail { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 28px 32px; min-width: 0; }
.detail h2 { font-size: 22px; line-height: 1.4; margin: 6px 0 4px; letter-spacing: -0.01em; }
.detail .sub { color: var(--muted); font-size: 13px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.conclusion { margin: 20px 0 8px; padding: 14px 16px; background: var(--accent-soft); border-radius: 8px; }
.conclusion b { display: block; font-size: 12px; color: var(--accent); margin-bottom: 2px; }
.detail h3 { font-size: 16px; margin: 28px 0 8px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.detail h4 { font-size: 14.5px; margin: 18px 0 4px; }
.detail ul, .detail ol { margin: 0; padding-left: 22px; }
.detail li { margin: 4px 0; }
.reply { border-left: 3px solid var(--line); padding-left: 14px; }
.refs { list-style: none; padding-left: 0 !important; }
.refs .tag { display: inline-block; min-width: 64px; }
.refs a { color: var(--accent); }
.refs .where { color: var(--muted); font-size: 13px; }
.actions { display: flex; gap: 8px; margin-top: 12px; }
.btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer; }
.empty { color: var(--muted); padding: 24px 4px; }
footer { color: var(--muted); font-size: 12.5px; padding: 0 0 32px; }
.back { display: none; }
@media (max-width: 860px) {
  .layout { grid-template-columns: 1fr; }
  .list { position: static; max-height: none; }
  body.has-detail .list, body.has-detail .tools { display: none; }
  body:not(.has-detail) .detail { display: none; }
  .detail { padding: 20px 18px; }
  .back { display: inline-block; margin-bottom: 8px; }
}
@media print {
  header, .list, .actions, .back, footer { display: none !important; }
  .layout { display: block; padding: 0; }
  .detail { border: 0; padding: 0; }
}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <h1><a href="#">학교회계 질의회신</a></h1>
      <span class="count" id="count"></span>
    </div>
    <div class="tools" role="search">
      <input id="q" type="search" placeholder="검색 (예: 선금, 세금계산서, 이월)" aria-label="검색">
      <div id="tags" style="display:flex;gap:6px;flex-wrap:wrap"></div>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="layout">
    <nav class="list" id="list" aria-label="질의 목록"></nav>
    <article class="detail" id="detail"></article>
  </div>
  <footer>
    일반적인 검토 의견입니다. 개별 사안은 사실관계와 해당 연도 지침에 따라 달라질 수 있습니다. 학교명과 담당자 정보는 공개하지 않습니다.
  </footer>
</div>

<script src="data/qa.js"></script>
<script>
(function () {
  const QA = (window.QA || []).slice().sort((a, b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id));
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  let tag = "";

  const allTags = [...new Set(QA.flatMap((x) => x.tags || []))];
  $("tags").innerHTML = ['<button class="chip" data-tag="" aria-pressed="true">전체</button>']
    .concat(allTags.map((t) => `<button class="chip" data-tag="${esc(t)}" aria-pressed="false">${esc(t)}</button>`)).join("");
  $("tags").addEventListener("click", (e) => {
    const b = e.target.closest("[data-tag]");
    if (!b) return;
    tag = b.dataset.tag;
    $("tags").querySelectorAll(".chip").forEach((c) => c.setAttribute("aria-pressed", c === b));
    renderList();
  });
  $("q").addEventListener("input", renderList);

  function text(x) {
    return [x.title, x.org, x.conclusion, ...(x.tags || []), ...(x.questions || []), ...(x.checks || []), ...(x.reply || []),
      ...(x.sections || []).flatMap((s) => [s.title, ...s.items]), ...(x.refs || []).map((f) => f.title)].join(" ").toLowerCase();
  }
  function filtered() {
    const words = $("q").value.trim().toLowerCase().split(/\s+/).filter(Boolean);
    return QA.filter((x) => (!tag || (x.tags || []).includes(tag)) && words.every((w) => text(x).includes(w)));
  }
  function statusTag(s) { return `<span class="status ${s === "회신 완료" ? "done" : ""}">${esc(s)}</span>`; }

  function renderList() {
    const items = filtered();
    const cur = location.hash.slice(1);
    $("count").textContent = `${QA.length}건`;
    $("list").innerHTML = items.length ? items.map((x) => `
      <a class="card" href="#${esc(x.id)}" aria-current="${x.id === cur}">
        <div class="meta"><span>${esc(x.date)}</span>${statusTag(x.status)}<span class="tag">${esc((x.tags || []).join(" · "))}</span></div>
        <div class="t">${esc(x.title)}</div>
      </a>`).join("") : '<div class="empty">검색 결과가 없습니다.</div>';
  }

  const ul = (arr, tagName = "ul") => `<${tagName}>${arr.map((i) => `<li>${esc(i)}</li>`).join("")}</${tagName}>`;

  function renderDetail() {
    const id = decodeURIComponent(location.hash.slice(1));
    const x = QA.find((q) => q.id === id) || (window.innerWidth > 860 ? QA[0] : null);
    document.body.classList.toggle("has-detail", !!id && !!x);
    if (!x) { $("detail").innerHTML = '<div class="empty">질의를 선택하세요.</div>'; return; }
    document.title = `${x.title} | 학교회계 질의회신`;
    $("detail").innerHTML = `
      <a class="btn back" href="#">← 목록</a>
      <div class="sub"><span>${esc(x.id)}</span><span>${esc(x.date)}</span>${x.revised ? `<span>재검토 ${esc(x.revised)}</span>` : ""}<span>${esc(x.org || "")}</span>${statusTag(x.status)}</div>
      <h2>${esc(x.title)}</h2>
      <div class="sub">${(x.tags || []).map((t) => `<span class="tag">#${esc(t)}</span>`).join("")}</div>
      <div class="conclusion"><b>결론</b>${esc(x.conclusion)}</div>
      <h3>질의 요지</h3>${ul(x.questions || [], "ol")}
      <h3>검토 의견</h3>${(x.sections || []).map((s) => `<h4>${esc(s.title)}</h4>${ul(s.items)}`).join("")}
      ${x.checks && x.checks.length ? `<h3>확인 필요 사항</h3>${ul(x.checks)}` : ""}
      <h3>회신 요지</h3><div class="reply">${ul(x.reply || [], "ol")}</div>
      ${x.refs && x.refs.length ? `<h3>참고 근거</h3><ul class="refs">${x.refs.map((f) => `<li><span class="tag">${esc(f.type)}</span> ${
        f.url ? `<a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.title)}</a>` : esc(f.title)}${f.where ? ` <span class="where">· ${esc(f.where)}</span>` : ""}</li>`).join("")}</ul>` : ""}
      <div class="actions">
        <button class="btn" id="copy">링크 복사</button>
        <button class="btn" onclick="window.print()">인쇄</button>
      </div>`;
    $("copy").onclick = () => navigator.clipboard && navigator.clipboard.writeText(location.href)
      .then(() => { $("copy").textContent = "복사됨"; }).catch(() => {});
    window.scrollTo(0, 0);
  }

  window.addEventListener("hashchange", () => { renderList(); renderDetail(); });
  renderList();
  renderDetail();
})();
</script>
</body>
</html>
